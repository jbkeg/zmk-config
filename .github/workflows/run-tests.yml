name: Run ZMK tests

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the uploaded log archive"
        type: string
        required: false
        default: "log-files"
      test-dir:
        description: "Path to the tests directory"
        type: string
        required: false
        default: "tests"
      zmk-version:
        description: "Version of ZMK to test with (default: read from VERSION)"
        type: string
        required: false
        default: ""
      verbose:
        description: "Show detailed build logs"
        type: boolean
        required: false
        default: false

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:3.5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve ZMK version
        id: zmk-version
        shell: bash
        env:
          INPUT_ZMK_VERSION: ${{ inputs.zmk-version }}
        run: |
          set -euo pipefail

          ZMK_VERSION="${INPUT_ZMK_VERSION:-}"
          ZMK_VERSION="${ZMK_VERSION:-$(cat VERSION)}"
          echo "version=${ZMK_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated workspace
        id: workspace
        shell: bash
        env:
          TEST_DIR: ${{ inputs.test-dir }}
        run: |
          set -euo pipefail

          workspace="$(mktemp -d -p "${RUNNER_TEMP}" tests.XXXXXXXXXX)"
          echo "workspace=${workspace}" >> "$GITHUB_OUTPUT"
          mkdir -p "${workspace}/${TEST_DIR}"
          cp -R "${TEST_DIR}/." "${workspace}/${TEST_DIR}/"

      - name: Set ZMK version in isolated workspace
        shell: bash
        env:
          TEST_DIR: ${{ inputs.test-dir }}
          WORKSPACE: ${{ steps.workspace.outputs.workspace }}
          ZMK_VERSION: ${{ steps.zmk-version.outputs.version }}
        run: |
          set -euo pipefail

          manifest_path="${WORKSPACE}/${TEST_DIR}/west.yml"

          python3 - "${manifest_path}" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version = os.environ["ZMK_VERSION"]
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          found_revision = False
          in_zmk_project = False

          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "- name: zmk":
                  in_zmk_project = True
                  continue

              if in_zmk_project and re.fullmatch(r"\s*revision:\s*.+\s*", stripped):
                  indent = re.match(r"\s*", line).group(0)
                  newline = "\n" if line.endswith("\n") else ""
                  lines[index] = f"{indent}revision: {version}{newline}"
                  found_revision = True
                  break

          if not found_revision:
              raise SystemExit(f"Could not find the zmk project revision in {path}.")

          path.write_text("".join(lines), encoding="utf-8")
          print(path.read_text(encoding="utf-8"), end="")
          PY

      - name: Cache west modules
        id: cache-west
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.workspace.outputs.workspace }}/modules/
            ${{ steps.workspace.outputs.workspace }}/tools/
            ${{ steps.workspace.outputs.workspace }}/zephyr/
            ${{ steps.workspace.outputs.workspace }}/bootloader/
            ${{ steps.workspace.outputs.workspace }}/zmk/
          key: zephyr-${{ steps.zmk-version.outputs.version }}-${{ hashFiles(format('{0}/west.yml', inputs.test-dir)) }}
          restore-keys: zephyr-

      - name: Initialize west workspace
        shell: bash
        working-directory: ${{ steps.workspace.outputs.workspace }}
        env:
          TEST_DIR: ${{ inputs.test-dir }}
        run: |
          set -euo pipefail

          west init -l "${TEST_DIR}"
          if [ "${{ steps.cache-west.outputs.cache-hit }}" != "true" ]; then
            west update --fetch-opt=--filter=tree:0
          fi
          west zephyr-export

      - name: Export ZMK source directory
        id: zmkpath
        shell: bash
        working-directory: ${{ steps.workspace.outputs.workspace }}
        run: |
          set -euo pipefail
          echo "zmk-src-dir=$(find -path '*/zmk/app/west.yml' -printf '%h\n' -quit)" >> "$GITHUB_OUTPUT"

      - name: Export test environment
        id: test-env
        shell: bash
        run: |
          set -euo pipefail

          build_dir="$(mktemp -d -p "${RUNNER_TEMP}" build.XXXXXXXXXX)"
          echo "build_dir=${build_dir}" >> "$GITHUB_OUTPUT"
          echo "ZMK_BUILD_DIR=${build_dir}" >> "$GITHUB_ENV"
          echo "ZMK_SRC_DIR=${{ steps.zmkpath.outputs.zmk-src-dir }}" >> "$GITHUB_ENV"
          if [ -e "${GITHUB_WORKSPACE}/zephyr/module.yml" ]; then
            echo "ZMK_EXTRA_MODULES=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.verbose }}" = "true" ]; then
            echo "ZMK_TESTS_VERBOSE=true" >> "$GITHUB_ENV"
          fi

      - name: Run tests
        shell: bash
        working-directory: ${{ steps.workspace.outputs.workspace }}
        env:
          TEST_DIR: ${{ inputs.test-dir }}
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/run-zmk-tests.sh" "${TEST_DIR}"

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ steps.test-env.outputs.build_dir }}/**/*.log
